name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: write

jobs:
  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar archivo de lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Guardar archivo de lock
        run: |
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Agregar archivo de lock de dependencias"
            git push
          else
            echo "El archivo package-lock.json ya está actualizado."
          fi

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npm test
